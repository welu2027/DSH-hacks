<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <defs>
    <linearGradient id="face" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CED0FA"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9ADF6"/>
      <stop offset="1" stop-color="#E6E8FC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#A9ADF6"/>
      <stop offset="1" stop-color="#0A14E4"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2440F8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2440F8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hedge" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#E6E8FC"/>
      <stop offset="1" stop-color="#6C72EF"/>
    </radialGradient>
  </defs>
  <!-- island -->
  <path d="M30 290h460c-20 30-70 46-120 54-30 20-70 30-110 30s-80-10-110-30c-50-8-100-24-120-54z" fill="url(#rock)"/>
  <path d="M90 316c50 14 110 20 170 20s120-6 170-20" fill="none" stroke="#6C72EF" stroke-opacity=".45"/>
  <rect x="24" y="276" width="472" height="18" rx="9" fill="#FFFFFF" stroke="#0C1046" stroke-width="1.25"/>

  <!-- the steps: 2 · 1 · 3 -->
  <path d="M96 276V206a10 10 0 0 1 10-10h94v80z" fill="url(#face)" stroke="#0C1046" stroke-width="1.5"/>
  <path d="M200 276V146a10 10 0 0 1 10-10h100a10 10 0 0 1 10 10v130z" fill="url(#face)" stroke="#0C1046" stroke-width="1.5"/>
  <path d="M320 276v-50h94a10 10 0 0 1 10 10v40z" fill="url(#face)" stroke="#0C1046" stroke-width="1.5"/>
  <path d="M104 204h90M208 144h104M328 234h88" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#0A14E4" text-anchor="middle">
    <text x="148" y="250" font-size="44">2</text>
    <text x="260" y="222" font-size="64">1</text>
    <text x="372" y="264" font-size="34">3</text>
  </g>

  <!-- prize orbs over each step -->
  <circle cx="260" cy="82" r="46" fill="url(#halo)"/>
  <circle cx="260" cy="82" r="24" fill="url(#orb)" stroke="#0C1046" stroke-opacity=".4"/>
  <ellipse cx="252" cy="74" rx="8" ry="5" fill="#FFFFFF" fill-opacity=".85"/>
  <circle cx="148" cy="164" r="15" fill="url(#orb)" stroke="#0C1046" stroke-opacity=".4"/>
  <circle cx="372" cy="198" r="12" fill="url(#orb)" stroke="#0C1046" stroke-opacity=".4"/>
  <g stroke="#2440F8" stroke-width="1.5" stroke-linecap="round" opacity=".6">
    <path d="M260 40v-14M224 54l-9-9M296 54l9-9M214 82h-14M306 82h14"/>
  </g>

  <!-- hedges at the ends -->
  <path d="M34 276c0-20 12-32 26-32s24 10 26 20c4-4 8-6 12-6v18z" fill="url(#hedge)" stroke="#0C1046" stroke-width="1.25"/>
  <path d="M432 276c0-16 10-26 22-26 14 0 30 10 30 26z" fill="url(#hedge)" stroke="#0C1046" stroke-width="1.25"/>
</svg>
